<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khung Bảng Dữ Liệu</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #ccc; padding: 10px; text-align: left; }

  </style>
</head>
<body>

        </tr>

          <td>Dữ liệu 1.3</td>

        <tr>
          <td>Dữ liệu 2.1</td>
          <td>Dữ liệu 2.2</td>

        <tr>

          <td>Dữ liệu 3.3</td>

    </table>

    <div style="text-align: center; margin-top: 20px;">
      <a href="index.html" style="color: #666; font-size: 14px; text-decoration: none;">← Quay lại danh mục khung mẫu</a>

</body>
</html>
