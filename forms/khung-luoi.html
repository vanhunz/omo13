<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khung Bố Cục Lưới (Grid)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f5f5f5; padding: 20px; }
    .container { max-width: 960px; margin: 0 auto; }
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }
    .grid-item {
      background: #fff;
      padding: 20px;
      border-radius: 6px;
      border: 1px dashed #bbb;
      text-align: center;
      min-height: 180px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2 style="text-align: center; color: #333;">KHUNG BỐ CỤC LƯỚI (GRID CARD)</h2>

    <div class="grid-container">
      <div class="grid-item">[ Ô LƯỚI 1 ]</div>
      <div class="grid-item">[ Ô LƯỚI 2 ]</div>
      <div class="grid-item">[ Ô LƯỚI 3 ]</div>
      <div class="grid-item">[ Ô LƯỚI 4 ]</div>
      <div class="grid-item">[ Ô LƯỚI 5 ]</div>
      <div class="grid-item">[ Ô LƯỚI 6 ]</div>
    </div>

    <div style="text-align: center; margin-top: 25px;">
      <a href="index.html" style="color: #666; font-size: 14px; text-decoration: none;">← Quay lại danh mục khung mẫu</a>
    </div>
  </div>

</body>
</html>
